[alembic]
# This ini is used in TWO contexts:
#   1. Inside Docker  (WORKDIR=/app, files at /app/alembic/)
#   2. Locally        (run from project/ dir, files at api/alembic/)
# The API lifespan overrides sqlalchemy.url at runtime, so the URL below
# is only used when running alembic CLI directly from project/.
script_location = alembic
prepend_sys_path = .
version_locations = alembic/versions
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/publications

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
